<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: wss: http:; frame-src 'self' blob: data:; form-action 'self'">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Order</title>
<style>
  :root{--bg:#f5f4f1;--card:#fff;--ink:#1a1a1a;--muted:#6b6b6b;--line:#ebe8e3;--acc:#1a1a1a;--acc-ink:#fff;--bad:#b3261e;--ok:#1e7a3c}
  @media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--ink:#f1f1f1;--muted:#a3a3a3;--line:#2e2e2e;--acc:#f1f1f1;--acc-ink:#141414;--bad:#ff8a80;--ok:#7bd88f}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:640px;margin:0 auto;padding:16px 16px 110px}
  h1{font-size:20px;margin:0}.muted{color:var(--muted);font-size:13px}.bad{color:var(--bad)}.ok{color:var(--ok)}
  .head{margin-bottom:12px}.tbl{display:inline-block;margin-top:4px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--card)}
  .cats{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}.cats button{flex:none}
  button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
  button[aria-pressed=true],button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
  button:disabled{opacity:.5;cursor:default}
  input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
  .search{margin:0 0 8px}
  .item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px}
  .item small{color:var(--muted);display:block}.item .p{font-variant-numeric:tabular-nums;color:var(--muted)}
  .step{display:inline-flex;align-items:center;gap:10px}.step button{width:34px;height:34px;padding:0;border-radius:50%}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .bar .in{max-width:640px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
  .line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.line:last-child{border-bottom:0}
  label{display:block;margin:10px 0 4px;font-size:13px;color:var(--muted)}
</style>
<script src="config.js"></script>
</head>
<body>
<main id="app" aria-live="polite"><p class="muted">Loading the menu…</p></main>
<script type="module" src="order.js"></script>
</body>
</html>
