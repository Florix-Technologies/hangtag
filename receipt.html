<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: wss: http:; frame-src 'self' blob: data:; form-action 'self'">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Invoice</title>
<style>
  :root{--bg:#f5f4f1;--card:#fff;--ink:#1a1a1a;--muted:#6b6b6b;--line:#ebe8e3;--bad:#b3261e}
  @media (prefers-color-scheme:dark){:root{--bg:#141414;--card:#1e1e1e;--ink:#f1f1f1;--muted:#a3a3a3;--line:#2e2e2e;--bad:#ff8a80}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:560px;margin:0 auto;padding:16px}
  .card{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .logo{max-height:64px;max-width:180px;display:block;margin-bottom:8px}
  h1{font-size:20px;margin:0}.muted{color:var(--muted);font-size:13px}.void{color:var(--bad);font-weight:700;letter-spacing:.08em;border:2px solid var(--bad);display:inline-block;padding:2px 10px;border-radius:6px;margin-top:10px}
  table{width:100%;border-collapse:collapse;margin-top:14px}td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}td.r{text-align:right;white-space:nowrap;padding-left:10px}
  .tot td{font-weight:700;border-bottom:0}.sub{color:var(--muted);font-size:13px}
  .foot{margin-top:18px;font-size:12px;color:var(--muted)}button{margin-top:16px;font:inherit;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  @media print{body{background:#fff}.card{box-shadow:none}button{display:none}}
</style>
<script src="config.js"></script>
</head>
<body>
<main><div class="card" id="inv" aria-live="polite"><p class="muted">Loading the invoice…</p></div></main>
<script src="receipt.js"></script>
</body>
</html>
