<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#171916">
<title>Shop</title>
<style>
  :root{--bg:#f3f2ed;--card:#fff;--ink:#171916;--muted:#686b64;--line:#e5e3db;--accent:#1f5b3a;--accent2:#e6f1e9;--bad:#ad2e24;--ok:#257443;--shadow:0 8px 28px rgba(20,24,20,.08)}
  @media(prefers-color-scheme:dark){:root{--bg:#121411;--card:#1c1f1b;--ink:#f4f5ef;--muted:#a9ada4;--line:#30352e;--accent:#8ed2a7;--accent2:#263d2e;--bad:#ff9a90;--ok:#88d6a0;--shadow:none}}
  *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  button,input,select,textarea{font:inherit}button{min-height:44px;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:650;cursor:pointer}button:disabled{opacity:.45;cursor:default}.primary{color:#fff;background:#1f5b3a;border-color:#1f5b3a}.ghost{background:transparent}.danger{color:var(--bad)}
  main{max-width:720px;margin:auto;padding:0 14px 112px}.top{position:sticky;z-index:4;top:0;margin:0 -14px 12px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;background:color-mix(in srgb,var(--bg) 91%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .head{display:flex;align-items:center;gap:10px}.head h1{font-size:20px;line-height:1.1;margin:0;flex:1;overflow-wrap:anywhere}.pill{font-size:12px;background:var(--accent2);color:var(--accent);border-radius:999px;padding:4px 9px;font-weight:700}.muted{color:var(--muted)}.bad{color:var(--bad)}.ok{color:var(--ok)}.small{font-size:13px}
  .search,input,select,textarea{width:100%;min-height:44px;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.search{margin-top:11px}.cats{display:flex;gap:7px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.cats button{white-space:nowrap;border-radius:999px}.cats button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product{display:flex;min-width:0;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow)}.photo{aspect-ratio:1.25;background:var(--accent2);display:grid;place-items:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.photo span{font-size:30px;font-weight:800;color:var(--accent)}
  .body{display:flex;flex:1;flex-direction:column;padding:12px}.body h2{font-size:16px;line-height:1.25;margin:0}.body p{margin:4px 0}.body select{margin-top:auto}.price{font-weight:750;font-variant-numeric:tabular-nums}.stock{font-size:12px;color:var(--ok)}.stock.out{color:var(--bad)}.add{width:100%;margin-top:9px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:11px;box-shadow:var(--shadow)}.card h2{font-size:18px;margin:0 0 8px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row b,.row small{display:block}.step{display:flex;align-items:center;gap:5px}.step button{width:40px;padding:0}.step input{width:68px;min-height:40px;text-align:center;padding:6px}.sum{display:flex;justify-content:space-between;font-size:17px;padding-top:12px}.fields{display:grid;gap:10px}.fields label span{display:block;margin:0 0 4px;color:var(--muted);font-size:13px}.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choice label{display:grid;place-items:center;min-height:48px;border:1px solid var(--line);border-radius:12px}.choice input{position:absolute;opacity:0;width:1px}.choice label:has(input:checked){outline:2px solid var(--accent);background:var(--accent2)}
  .bottom{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}.bottom>div{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:720px;margin:auto}.bottom button{flex:none}.empty{text-align:center;padding:42px 18px}.status{display:grid;place-items:center;text-align:center;min-height:55vh}.tick{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--accent2);color:var(--ok);font-size:32px;font-weight:800}.order-no{font-size:23px;letter-spacing:.04em}.skeleton{height:180px;border-radius:17px;background:linear-gradient(100deg,var(--line),var(--card),var(--line));background-size:220% 100%;animation:load 1.3s infinite}@keyframes load{to{background-position:-220% 0}}
  .head .logo{width:40px;height:40px;border-radius:10px;object-fit:contain;background:var(--card);border:1px solid var(--line);flex:none}.head .title{flex:1;min-width:0}.head .title h1{flex:none}.head .title span{display:block;margin-top:2px}
  .vchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px}.vchip{min-height:36px;padding:6px 11px;border-radius:10px;font-size:13px;font-weight:600}.vchip[aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.vchip.out{text-decoration:line-through}
  @media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:360px){.grid{grid-template-columns:1fr}.choice{grid-template-columns:1fr}.choice label{display:flex;justify-content:flex-start;padding:0 12px}}
</style>
<script src="config.js"></script>
</head>
<body><main id="app" aria-live="polite"><div class="top"><div class="head"><h1>Shop</h1></div></div><div class="grid"><div class="skeleton"></div><div class="skeleton"></div></div></main>
<script type="module" src="store.js"></script>
</body>
</html>
